name: Central E2E PR Validation

on:
  pull_request:
    branches: [ main, dev ]

jobs:
  build-pr-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:pr-${{ github.event.number }}

  call-central-e2e:
    needs: build-pr-image
    uses: 7-3-N-3-7/api/.github/workflows/e2e-dast-pipeline.yml@main
    with:
      frontend_tag: pr-${{ github.event.number }}

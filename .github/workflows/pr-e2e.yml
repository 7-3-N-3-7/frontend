name: Central E2E PR Validation

on:
  pull_request:
    branches: [ main, dev ]

concurrency:
  group: pr-e2e-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@288a8a8643a2c5a36b81d231c550dccfa0beeb64
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}

  build-pr-image:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    needs: trufflehog
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Normalize image name
        shell: bash
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:pr-${{ github.event.number }}-${{ github.sha }}

  determine-backend-tag:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    outputs:
      backend_tag: ${{ steps.resolve-tag.outputs.tag }}
    steps:
      - id: resolve-tag
        name: Resolve Backend Tag
        env:
          BRANCH_NAME: ${{ github.head_ref }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Check if the backend image exists with the current branch name tag
          # If not, fallback to 'main'
          
          IMAGE="ghcr.io/7-3-n-3-7/backend"
          TAG="$BRANCH_NAME"
          
          # A simple check using docker manifest (requires experimental flag)
          export DOCKER_CLI_EXPERIMENTAL=enabled
          echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          
          if docker manifest inspect $IMAGE:$TAG > /dev/null 2>&1; then
            echo "Found matching backend branch tag: $TAG"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          else
            echo "Matching backend tag not found, falling back to 'main'"
            echo "tag=main" >> "$GITHUB_OUTPUT"
          fi

  call-central-e2e:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    needs: [build-pr-image, determine-backend-tag]
    permissions:
      contents: read
      packages: read
    uses: 7-3-N-3-7/infrastructure/.github/workflows/e2e-pipeline.yml@main
    secrets: inherit
    with:
      backend_tag: ${{ needs.determine-backend-tag.outputs.backend_tag }}
      frontend_tag: pr-${{ github.event.number }}-${{ github.sha }}

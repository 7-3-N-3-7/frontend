name: Frontend CI Pipeline

on:
  push:
    branches: [ main, dev ]

jobs:
  security-governance:
    name: Run Central Security & Governance Gate
    uses: 7-3-N-3-7/api/.github/workflows/trufflehog-scan.yml@main

  build-and-lint:
    name: Run Standard Frontend CI
    uses: 7-3-N-3-7/api/.github/workflows/standard-frontend-ci.yml@main
    needs: security-governance

  build-and-push-image:
    name: Build and Publish Frontend Docker Image
    needs: [security-governance, build-and-lint]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

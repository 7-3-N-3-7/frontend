name: Build and Push

on:
  push:
    branches: [ "main", "dev" ]

jobs:
  docker:
    # Kalder din centrale pipeline! Ret "7-3-N-3-7/api" til navnet på det repo hvor den centrale fil ligger, hvis det hedder noget andet.
    uses: 7-3-N-3-7/infrastructure/.github/workflows/docker-build-push.yml@main
    secrets:
      # Bruger en GitHub token (enten GITHUB_TOKEN eller en Personal Access Token gemt som GH_PAT)
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    with:
      # Sæt navnet til frontend eller backend
      image_name: "7-3-N-3-7/frontend"
server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Serve static assets with caching
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # SPA routing and disable caching for index.html
    location / {
        try_files $uri $uri/ /index.html;
        
        # Kill cache for HTML files
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        if_modified_since off;
        expires off;
        etag off;
    }

    # Proxy API requests to avoid CORS issues in Docker
    location /realms/ {
        proxy_pass https://login.157.180.43.151.nip.io/realms/;
        proxy_ssl_server_name on;
        proxy_set_header Host login.157.180.43.151.nip.io;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
